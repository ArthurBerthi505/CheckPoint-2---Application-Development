<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atores e Atrizes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Atores e Atrizes</h1>
        <p>Conheça os artistas e pesquise pelo nome.</p>
    </header>

    <main>
        <div class="busca">
            <label for="pesquisa">Buscar por nome</label>
            <input type="text" id="pesquisa" placeholder="Ex.: Tom" oninput="filtrarAtores()">
        </div>

        <p id="quantidade" aria-live="polite"></p>
        <section id="lista-atores" class="grid" aria-label="Lista de atores e atrizes"></section>
        <p id="sem-resultados" hidden>Nenhum ator ou atriz encontrado.</p>
    </main>

    <footer>CheckPoint 2 — Application Development</footer>

    <!-- Os dados precisam carregar antes do código que cria os cards. -->
    <script src="dados.js"></script>
    <script src="script.js"></script>
</body>
</html>
